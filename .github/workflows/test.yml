name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model archive checksum
        run: echo "66e693abfdf821af96f241ee707f74efe44939c4d7b3d63ef830169b075e1ba3  model/FSAE-2027-Electric-Arcadia.zip" | sha256sum -c
      - name: Rule inventory and slices
        run: |
          for d in acceptance/rules acceptance/safety/shutdown acceptance/safety/driver-demand; do
            (cd "$d" && python -m unittest -v)
          done
