name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Model checksums
        run: |
          cd model
          sha256sum -c SHA256SUMS
          # every model file is listed, so an added file cannot slip past the sums
          diff <(find FSAE-2027-Electric-Arcadia -type f | sort) <(cut -c67- SHA256SUMS | sort)
      - name: Rule inventory and slices
        run: |
          for d in acceptance/rules acceptance/safety/shutdown acceptance/safety/driver-demand acceptance/submissions; do
            (cd "$d" && python -m unittest -v)
          done
