name: test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Model checksums
        run: |
          cd model
          sha256sum -c SHA256SUMS
          # every model file is listed, so an added file cannot slip past the sums
          diff <(find FSAE-2027-Electric-Arcadia -type f | sort) <(cut -c67- SHA256SUMS | sort)
      - name: Rule inventory and slices
        run: |
          for d in acceptance/rules acceptance/safety/shutdown acceptance/safety/driver-demand acceptance/submissions; do
            (cd "$d" && python -m unittest -v)
          done
